# OMARec defaults template (also the first-run seed).
#
# Live state lives in $XDG_STATE_HOME/omarec/omarec.conf (usually
# ~/.local/state/omarec/omarec.conf) — seeded from this file once, then
# authoritative there. An empty device means "auto-detect the first webcam".
device=
size=medium
orientation=portrait
rounding=12
position=bottom-right
